<section class="page">
  <header class="page-header">
    <a class="back" [routerLink]="['/']"><i class="material-icons">arrow_back</i> All games</a>
    <h1>Tic Tac Toe</h1>
    <p class="subtitle">Three in a row wins. The AI uses minimax search — try beating it on Hard.</p>
  </header>

  <div class="scoreboard">
    <div class="score-item you">
      <span class="label">You (X)</span>
      <span class="value">{{ score.human }}</span>
    </div>
    <div class="score-item draw">
      <span class="label">Draws</span>
      <span class="value">{{ score.draw }}</span>
    </div>
    <div class="score-item ai">
      <span class="label">AI (O)</span>
      <span class="value">{{ score.ai }}</span>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <span class="control-label">Difficulty</span>
      <div class="segmented">
        <button *ngFor="let d of difficulties" type="button"
                [class.active]="difficulty === d.value"
                (click)="setDifficulty(d.value)">{{ d.label }}</button>
      </div>
    </div>
    <div class="control-group">
      <span class="control-label">First move</span>
      <div class="segmented">
        <button type="button" [class.active]="humanStarts" (click)="setFirstPlayer(true)">You</button>
        <button type="button" [class.active]="!humanStarts" (click)="setFirstPlayer(false)">AI</button>
      </div>
    </div>
  </div>

  <div class="status" [ngClass]="status" aria-live="polite">
    <span class="dot"></span>{{ message }}
  </div>

  <div class="board" [class.locked]="status !== 'human'">
    <button *ngFor="let i of cells" type="button" class="cell"
            [ngClass]="{ x: board[i] === 'X', o: board[i] === 'O',
                         win: isWinningCell(i), last: lastMove === i,
                         dim: status === 'over' && winLine.length && !isWinningCell(i) }"
            [disabled]="board[i] !== null || status !== 'human'"
            [attr.aria-label]="'Cell ' + (i + 1) + (board[i] ? ', ' + board[i] : ', empty')"
            (click)="play(i)">
      <span *ngIf="board[i]" class="mark">{{ board[i] }}</span>
    </button>
  </div>

  <div class="actions">
    <button mat-raised-button color="primary" (click)="newRound()">
      {{ status === 'over' ? 'Play again' : 'Restart round' }}
    </button>
    <button mat-button (click)="resetScore()">Reset score</button>
  </div>
</section>
